[workspace]
members = [
    "crates/sley-core",
    "crates/sley-object",
    "crates/sley-config",
    "crates/sley-notes",
    "crates/sley-index",
    "crates/sley-formats",
    "crates/sley-protocol",
    "crates/sley-odb",
    "crates/sley-refs",
    "crates/sley-pathspec",
    "crates/sley-grep",
    "crates/sley-i18n",
    "crates/sley-pretty",

    "crates/sley-rev",
    "crates/sley-worktree",
    "crates/sley-diff-merge",
    "crates/sley-unpack-trees",
    "crates/sley-sequencer",
    "crates/sley-submodule",
    "crates/sley-pack",
    "crates/sley-mmap",
    "crates/sley-procinfo",
    "crates/sley-transport",
    "crates/sley-options",
    "crates/sley-strbuf-expand",
    "crates/sley-remote",
    "crates/sley-ref-filter",
    "crates/sley-fsck",
    "crates/sley-archive",
    "crates/sley",
    "crates/sley-cli",
    "crates/sley-testkit",
    "crates/sley-bench",
]
resolver = "3"

[workspace.dependencies]
sley-archive = { path = "crates/sley-archive", version = "0.4.0" }
sley-bench = { path = "crates/sley-bench", version = "0.4.0" }
sley-cli = { path = "crates/sley-cli", version = "0.4.0" }
sley-config = { path = "crates/sley-config", version = "0.4.0" }
sley-core = { path = "crates/sley-core", version = "0.4.0" }

sley-diff-merge = { path = "crates/sley-diff-merge", version = "0.4.0" }
sley-formats = { path = "crates/sley-formats", version = "0.4.0" }
sley-fsck = { path = "crates/sley-fsck", version = "0.4.0" }
sley-grep = { path = "crates/sley-grep", version = "0.4.0" }
sley-i18n = { path = "crates/sley-i18n", version = "0.4.0" }
sley-index = { path = "crates/sley-index", version = "0.4.0" }
sley-mmap = { path = "crates/sley-mmap", version = "0.4.0" }
sley-notes = { path = "crates/sley-notes", version = "0.4.0" }
sley-object = { path = "crates/sley-object", version = "0.4.0" }
sley-odb = { path = "crates/sley-odb", version = "0.4.0" }
sley-options = { path = "crates/sley-options", version = "0.4.0" }
sley-pack = { path = "crates/sley-pack", version = "0.4.0" }
sley-pathspec = { path = "crates/sley-pathspec", version = "0.4.0" }
sley-pretty = { path = "crates/sley-pretty", version = "0.4.0" }
sley-procinfo = { path = "crates/sley-procinfo", version = "0.4.0" }
sley-protocol = { path = "crates/sley-protocol", version = "0.4.0" }
sley-ref-filter = { path = "crates/sley-ref-filter", version = "0.4.0" }
sley-refs = { path = "crates/sley-refs", version = "0.4.0" }
sley-remote = { path = "crates/sley-remote", version = "0.4.0" }
sley-rev = { path = "crates/sley-rev", version = "0.4.0" }
sley-sequencer = { path = "crates/sley-sequencer", version = "0.4.0" }
sley-strbuf-expand = { path = "crates/sley-strbuf-expand", version = "0.4.0" }
sley-submodule = { path = "crates/sley-submodule", version = "0.4.0" }
sley-testkit = { path = "crates/sley-testkit", version = "0.4.0" }
sley-transport = { path = "crates/sley-transport", version = "0.4.0" }
sley-unpack-trees = { path = "crates/sley-unpack-trees", version = "0.4.0" }
sley-worktree = { path = "crates/sley-worktree", version = "0.4.0" }
sley = { path = "crates/sley", version = "0.4.0" }

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/HeddleCo/sley"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
clone_on_copy = "allow"
