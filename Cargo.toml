[workspace]
members = [
    "crates/sley-core",
    "crates/sley-object",
    "crates/sley-config",
    "crates/sley-index",
    "crates/sley-formats",
    "crates/sley-protocol",
    "crates/sley-odb",
    "crates/sley-refs",
    "crates/sley-rev",
    "crates/sley-worktree",
    "crates/sley-diff-merge",
    "crates/sley-sequencer",
    "crates/sley-pack",
    "crates/sley-mmap",
    "crates/sley-transport",
    "crates/sley-fetch",
    "crates/sley-remote",
    "crates/sley-fsck",
    "crates/sley-archive",
    "crates/sley",
    "crates/sley-cli",
    "crates/sley-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
