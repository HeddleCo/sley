[workspace]
members = [
    "crates/sley-core",
    "crates/sley-object",
    "crates/sley-config",
    "crates/sley-notes",
    "crates/sley-index",
    "crates/sley-formats",
    "crates/sley-protocol",
    "crates/sley-odb",
    "crates/sley-refs",
    "crates/sley-pathspec",
    "crates/sley-grep",
    "crates/sley-pretty",
    "crates/sley-rev",
    "crates/sley-worktree",
    "crates/sley-diff-merge",
    "crates/sley-diff-format",
    "crates/sley-unpack-trees",
    "crates/sley-sequencer",
    "crates/sley-submodule",
    "crates/sley-pack",
    "crates/sley-mmap",
    "crates/sley-transport",
    "crates/sley-fetch",
    "crates/sley-options",
    "crates/sley-strbuf-expand",
    "crates/sley-remote",
    "crates/sley-ref-filter",
    "crates/sley-fsck",
    "crates/sley-archive",
    "crates/sley",
    "crates/sley-cli",
    "crates/sley-testkit",
    "crates/sley-bench",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HeddleCo/sley"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
clone_on_copy = "allow"
