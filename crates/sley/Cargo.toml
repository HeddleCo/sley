[package]
name = "sley"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sley-core = { path = "../sley-core" }
sley-object = { path = "../sley-object" }
sley-config = { path = "../sley-config" }
sley-formats = { path = "../sley-formats" }
sley-index = { path = "../sley-index" }
sley-odb = { path = "../sley-odb" }
sley-refs = { path = "../sley-refs" }
sley-rev = { path = "../sley-rev" }
sley-worktree = { path = "../sley-worktree" }

[features]
# Opt into the zlib-ng C backend for object (de)compression (forwarded to
# sley-odb / sley-pack). Default builds stay pure-Rust (miniz_oxide).
zlib-ng = ["sley-odb/zlib-ng"]
# Opt into the hardware-accelerated SHA-1 backend (forwarded to sley-core via
# sley-odb). Default builds stay pure-Rust. OIDs are byte-identical either way.
fast-sha1 = ["sley-core/fast-sha1", "sley-odb/fast-sha1"]
# Memory-map pack files (forwarded to sley-odb). Pulls in sley-mmap, the only crate
# with unsafe; off by default. Benefits large-repo memory use / cold start.
mmap = ["sley-odb/mmap"]

[lints]
workspace = true
