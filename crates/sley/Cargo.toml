[package]
name = "sley"
version.workspace = true
description = "Ergonomic facade over the sley engine, a native-Rust reimplementation of Git's plumbing."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sley-core = { path = "../sley-core", version = "0.3.0" }
sley-object = { path = "../sley-object", version = "0.3.0" }
sley-config = { path = "../sley-config", version = "0.3.0" }
sley-diff-format = { path = "../sley-diff-format", version = "0.3.0" }
sley-diff-merge = { path = "../sley-diff-merge", version = "0.3.0" }
sley-formats = { path = "../sley-formats", version = "0.3.0" }
sley-grep = { path = "../sley-grep", version = "0.3.0" }
sley-index = { path = "../sley-index", version = "0.3.0" }
sley-notes = { path = "../sley-notes", version = "0.3.0" }
sley-odb = { path = "../sley-odb", version = "0.3.0" }
sley-pretty = { path = "../sley-pretty", version = "0.3.0" }
sley-refs = { path = "../sley-refs", version = "0.3.0" }
sley-rev = { path = "../sley-rev", version = "0.3.0" }
sley-sequencer = { path = "../sley-sequencer", version = "0.3.0" }
sley-worktree = { path = "../sley-worktree", version = "0.3.0" }
sley-remote = { path = "../sley-remote", version = "0.3.0", optional = true }

[features]
default = ["remote", "mmap", "fast-sha1"]
# Callable fetch/push/clone/ls-remote orchestration (heddle transport surface).
# Enabled by default; disable with `default-features = false` for a smaller dep tree.
remote = ["dep:sley-remote", "sley-remote/http"]
# The (de)compression backend is the default-on zlib-rs (pure Rust, ~zlib-ng
# speed, no C). The `pure-rust` miniz_oxide fallback lives on sley-odb / sley-pack
# as a leaf-crate feature (`--no-default-features --features pure-rust`); it is
# not re-exported here because feature unification across this crate's other
# sley-odb consumers re-enables the default zlib-rs, so a forward could not swap it.
# Hardware-accelerated SHA-1 backend (forwarded to sley-core via sley-odb).
# Default-on for facade builds. OIDs are byte-identical either way.
fast-sha1 = ["sley-core/fast-sha1", "sley-odb/fast-sha1"]
# Memory-map pack files (forwarded to sley-odb). Pulls in sley-mmap, the only crate
# with unsafe; default-on for the facade while remaining opt-in on sley-odb.
mmap = ["sley-odb/mmap"]
# TLS backend for HTTPS remotes (forwarded to sley-remote / sley-transport).
# Default remote/http uses rustls; enable one of these to override.
tls-rustls = ["sley-remote/tls-rustls"]
tls-native-tls = ["sley-remote/tls-native-tls"]
tls-platform-verifier = ["sley-remote/tls-platform-verifier"]

[lints]
workspace = true
