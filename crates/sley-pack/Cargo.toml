[package]
name = "sley-pack"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sley-core = { path = "../sley-core" }
sley-formats = { path = "../sley-formats" }
sley-object = { path = "../sley-object" }

[features]
# Use flate2's zlib-ng C backend for (de)compression instead of the default
# pure-Rust miniz_oxide. Faster on large objects but needs a C toolchain, so it
# is opt-in for downstream consumers that want the perf.
zlib-ng = ["flate2/zlib-ng"]
# Forward the hardware-accelerated SHA-1 backend (see sley-core).
fast-sha1 = ["sley-core/fast-sha1"]

[lints]
workspace = true
