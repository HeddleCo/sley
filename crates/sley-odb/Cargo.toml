[package]
name = "sley-odb"
version.workspace = true
description = "Native-Rust Git object database for the sley engine: loose objects, packfiles, and multi-pack indexes."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Backend selected by the mutually-exclusive zlib-rs/pure-rust features below;
# no backend baked into the dep line (see sley-pack for the cfg-cascade rationale).
flate2 = { version = "1", default-features = false }
sley-core = { path = "../sley-core", version = "0.2.0" }
sley-formats = { path = "../sley-formats", version = "0.2.0" }
sley-mmap = { path = "../sley-mmap", version = "0.2.0", optional = true }
sley-object = { path = "../sley-object", version = "0.2.0" }
sley-pack = { path = "../sley-pack", version = "0.2.0", default-features = false }

[features]
default = ["zlib-rs"]
# Default backend: zlib-rs (pure Rust, ~zlib-ng speed, no C). Forwarded to sley-pack.
zlib-rs = ["flate2/zlib-rs", "sley-pack/zlib-rs"]
# Fallback backend: flate2's miniz_oxide (`rust_backend`), forwarded to sley-pack.
# For no-C/wasm targets; select with `--no-default-features --features pure-rust`.
pure-rust = ["flate2/rust_backend", "sley-pack/pure-rust"]
# Forward the hardware-accelerated SHA-1 backend (see sley-core).
fast-sha1 = ["sley-core/fast-sha1", "sley-pack/fast-sha1"]
# Memory-map pack files instead of reading them into the heap. Pulls in sley-mmap
# (the workspace's only unsafe). Off by default; the gain is on large repos.
mmap = ["dep:sley-mmap"]

[lints]
workspace = true
