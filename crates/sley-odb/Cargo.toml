[package]
name = "sley-odb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Default (de)compression backend is zlib-rs (pure Rust, ~zlib-ng speed, no C).
# See sley-pack for the `pure-rust` miniz_oxide fallback.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sley-core = { path = "../sley-core" }
sley-formats = { path = "../sley-formats" }
sley-mmap = { path = "../sley-mmap", optional = true }
sley-object = { path = "../sley-object" }
sley-pack = { path = "../sley-pack" }

[features]
# Swap the default zlib-rs backend for flate2's miniz_oxide (`rust_backend`),
# also forwarded to sley-pack. For no-C/wasm targets where zlib-rs is unavailable.
pure-rust = ["flate2/rust_backend", "sley-pack/pure-rust"]
# Forward the hardware-accelerated SHA-1 backend (see sley-core).
fast-sha1 = ["sley-core/fast-sha1", "sley-pack/fast-sha1"]
# Memory-map pack files instead of reading them into the heap. Pulls in sley-mmap
# (the workspace's only unsafe). Off by default; the gain is on large repos.
mmap = ["dep:sley-mmap"]

[lints]
workspace = true
