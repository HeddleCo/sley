[package]
name = "sley-archive"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5.0"
# zip deflate. default-features=false + zlib-rs matches sley-pack so the
# workspace resolves a single flate2 backend (no C toolchain).
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
sley-config.workspace = true
sley-core.workspace = true
sley-object.workspace = true
sley-odb.workspace = true
sley-pathspec.workspace = true
sley-worktree.workspace = true

[lints]
workspace = true
