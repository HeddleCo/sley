[package]
name = "sley-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "sley_cli"
path = "src/lib.rs"

[[bin]]
name = "sley"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
sley-archive = { path = "../sley-archive" }
sley-config = { path = "../sley-config" }
sley-core = { path = "../sley-core" }
sley-diff-merge = { path = "../sley-diff-merge" }
sley-fetch = { path = "../sley-fetch" }
sley-formats = { path = "../sley-formats" }
sley-fsck = { path = "../sley-fsck" }
sley-index = { path = "../sley-index" }
sley-notes = { path = "../sley-notes" }
sley-object = { path = "../sley-object" }
sley-odb = { path = "../sley-odb" }
sley-options = { path = "../sley-options" }
sley-pack = { path = "../sley-pack" }
sley-pathspec = { path = "../sley-pathspec" }
sley-protocol = { path = "../sley-protocol" }
sley-ref-filter = { path = "../sley-ref-filter" }
sley-refs = { path = "../sley-refs" }
sley-remote = { path = "../sley-remote" }
sley-rev = { path = "../sley-rev" }
sley-sequencer = { path = "../sley-sequencer" }
sley-strbuf-expand = { path = "../sley-strbuf-expand" }
sley-submodule = { path = "../sley-submodule" }
sley-testkit = { path = "../sley-testkit" }
sley-transport = { path = "../sley-transport", features = ["http-client", "tls-rustls"] }
sley-unpack-trees = { path = "../sley-unpack-trees" }
sley-worktree = { path = "../sley-worktree" }

[features]
default = ["mmap", "fast-sha1"]
# The (de)compression backend is the default-on zlib-rs (pure Rust, ~zlib-ng
# speed, no C). The `pure-rust` miniz_oxide fallback is a leaf-crate feature on
# sley-odb / sley-pack: a no-C/wasm consumer that needs it depends on those
# crates directly with `default-features = false, features = ["pure-rust"]`. It
# is NOT exposed here because the binary's many transitive sley-odb consumers
# re-enable the default zlib-rs under Cargo feature unification, so a top-level
# forward could not actually swap the backend.
#
# Build the sley binary with the hardware-accelerated SHA-1 backend (forwarded to
# sley-core). Default-on for CLI builds; OIDs are byte-identical either way.
fast-sha1 = ["sley-core/fast-sha1", "sley-odb/fast-sha1", "sley-pack/fast-sha1"]
# Build the sley binary with memory-mapped pack reads (forwarded to sley-odb).
# Pulls in sley-mmap (the only unsafe); default-on for CLI/facade builds.
mmap = ["sley-odb/mmap"]
# TLS backend for HTTPS remotes (forwarded to sley-transport via sley-remote).
tls-rustls = ["sley-transport/tls-rustls"]
tls-native-tls = ["sley-transport/tls-native-tls"]
tls-platform-verifier = ["sley-transport/tls-platform-verifier"]

[lints]
workspace = true
