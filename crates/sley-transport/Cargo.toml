[package]
name = "sley-transport"
version.workspace = true
description = "Smart-HTTP and git-protocol transport request/response codecs for the sley engine."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
http-client = ["dep:ureq"]
# TLS backend selection for HTTPS (pick one; default rustls via sley-remote/http).
tls-rustls = ["http-client", "ureq/rustls"]
tls-native-tls = ["http-client", "ureq/native-tls"]
tls-platform-verifier = ["http-client", "ureq/rustls", "ureq/platform-verifier"]

[dependencies]
sley-core = { path = "../sley-core", version = "0.4.0" }
sley-protocol = { path = "../sley-protocol", version = "0.4.0" }
# gzip is required for smart-HTTP; TLS features are forwarded separately above.
ureq = { version = "3.3.0", optional = true, default-features = false, features = ["gzip"] }

[lints]
workspace = true

