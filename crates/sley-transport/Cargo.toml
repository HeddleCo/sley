[package]
name = "sley-transport"
version.workspace = true
description = "Smart-HTTP and git-protocol transport request/response codecs for the sley engine."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
http-client = ["dep:ureq"]
# TLS backend selection for HTTPS (pick one; default rustls via sley-remote/http).
tls-rustls = ["dep:webpki-root-certs", "http-client", "ureq/rustls"]
tls-native-tls = ["http-client", "ureq/native-tls"]
tls-platform-verifier = ["http-client", "ureq/rustls", "ureq/platform-verifier"]

[dependencies]
sley-config.workspace = true
sley-core.workspace = true
sley-protocol.workspace = true
# gzip is required for smart-HTTP; TLS features are forwarded separately above.
ureq = { version = "3.3.0", optional = true, default-features = false, features = ["gzip"] }
webpki-root-certs = { version = "1.0", optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
