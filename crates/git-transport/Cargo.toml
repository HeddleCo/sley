[package]
name = "git-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
http-client = ["dep:ureq"]

[dependencies]
git-core = { path = "../git-core" }
git-protocol = { path = "../git-protocol" }
# Default features bundle rustls + ring + Mozilla webpki roots, so HTTPS to
# public hosts (GitHub/GitLab) works out of the box.
ureq = { version = "3.3.0", optional = true, default-features = true }

[lints]
workspace = true

