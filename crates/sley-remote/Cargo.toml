[package]
name = "sley-remote"
version.workspace = true
description = "Callable fetch, push, clone, and ls-remote orchestration over the sley transport and object stack."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["http", "ssh"]
http = ["sley-transport/http-client", "sley-transport/tls-rustls"]
ssh = []
# Forward ureq TLS backend selection to embedders (mutually exclusive in practice).
tls-rustls = ["sley-transport/tls-rustls"]
tls-native-tls = ["sley-transport/tls-native-tls"]
tls-platform-verifier = ["sley-transport/tls-platform-verifier"]
fetch-profile = [
    "sley-core/fetch-profile",
    "sley-odb/fetch-profile",
    "sley-pack/fetch-profile",
    "sley-protocol/fetch-profile",
]

[dependencies]
sley-config.workspace = true
sley-diff-merge.workspace = true
sley-core.workspace = true
sley-formats.workspace = true
sley-fsck.workspace = true
sley-index.workspace = true
sley-object.workspace = true
sley-odb.workspace = true
sley-pack.workspace = true
sley-protocol.workspace = true
sley-refs.workspace = true
sley-rev.workspace = true
sley-transport = { path = "../sley-transport", version = "0.8.0", default-features = false } # inline: default-features override cant use workspace inherit
sley-worktree.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
