[package]
name = "sley-remote"
version.workspace = true
description = "Callable fetch, push, clone, and ls-remote orchestration over the sley transport and object stack."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["http", "ssh"]
http = ["sley-transport/http-client", "sley-transport/tls-rustls"]
ssh = []
# Forward ureq TLS backend selection to embedders (mutually exclusive in practice).
tls-rustls = ["sley-transport/tls-rustls"]
tls-native-tls = ["sley-transport/tls-native-tls"]
tls-platform-verifier = ["sley-transport/tls-platform-verifier"]

[dependencies]
sley-config = { path = "../sley-config", version = "0.1.0" }
sley-core = { path = "../sley-core", version = "0.1.0" }
sley-fetch = { path = "../sley-fetch", version = "0.1.0" }
sley-formats = { path = "../sley-formats", version = "0.1.0" }
sley-object = { path = "../sley-object", version = "0.1.0" }
sley-odb = { path = "../sley-odb", version = "0.1.0" }
sley-pack = { path = "../sley-pack", version = "0.1.0" }
sley-protocol = { path = "../sley-protocol", version = "0.1.0" }
sley-refs = { path = "../sley-refs", version = "0.1.0" }
sley-rev = { path = "../sley-rev", version = "0.1.0" }
sley-transport = { path = "../sley-transport", version = "0.1.0", default-features = false }
sley-worktree = { path = "../sley-worktree", version = "0.1.0" }

[lints]
workspace = true