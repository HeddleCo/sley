name: Publish crates

# Publishes the sley library facade and its lib dependency closure to
# crates.io. The default run is a DRY RUN (no upload) — a human flips `dry_run`
# to false to perform the real publish. The token comes from the repo secret
# CRATES_IO_API_KEY (set as CARGO_REGISTRY_TOKEN for cargo).
#
# The crate set and its topological publish order are DERIVED at runtime from
# `cargo metadata` (publishable = workspace members with `publish` != false,
# each emitted after all of its in-workspace publishable deps). Nothing is
# hand-maintained, so the list can never go stale as crates are added, removed,
# or re-scoped. See the derivation step below.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real upload). Leave true to validate; set false to publish for real."
        type: boolean
        required: true
        default: true
      version:
        description: "Version to publish (must match the crates' Cargo.toml version)."
        type: string
        required: true
        default: "0.6.0"

concurrency:
  # Never run two real publishes concurrently — they would race on crates.io.
  group: publish-crates
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}

jobs:
  publish:
    name: Publish (${{ inputs.dry_run && 'dry-run' || 'REAL' }} @ ${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in topological order
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # DERIVED publish set + topological order — computed at runtime from
          # `cargo metadata`, never hand-maintained. This replaces the old baked
          # CRATES=(...) array (plus its count assertion and hand-kept order
          # re-assertion), which went stale every time a crate was added, removed,
          # or re-scoped (it broke sley 0.8's publish twice: a stale topo order,
          # then a facade→publish=false dep).
          #
          #   - publishable = workspace members whose `publish` is not [] (i.e.
          #     not `publish = false`). `--no-deps` keeps this to workspace
          #     members only; third-party deps are never in the set.
          #   - topological order: each crate is emitted after all of its
          #     in-workspace publishable dependencies, so every `cargo publish`
          #     can resolve its deps against crates.io. The `sley` facade falls
          #     out after its own deps naturally.
          echo "::group::Derive publish set + topological order"
          META="$(cargo metadata --format-version 1 --no-deps)"
          mapfile -t CRATES < <(python3 - "$META" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1])
          pub={p["name"] for p in m["packages"] if p.get("publish")!=[]}
          deps={p["name"]:{d["name"] for d in p["dependencies"] if d["name"] in pub and d["name"]!=p["name"]} for p in m["packages"] if p["name"] in pub}
          order,seen=[],set()
          def visit(n):
              if n in seen: return
              seen.add(n)
              for d in sorted(deps[n]): visit(d)
              order.append(n)
          for n in sorted(pub): visit(n)
          print("\n".join(order))
          PY
          )
          if [ "${#CRATES[@]}" -eq 0 ]; then
            echo "Derived publish set is empty — cargo metadata / derivation failed." >&2
            exit 1
          fi
          printf 'Derived %d publishable crates in topological order:\n' "${#CRATES[@]}"
          printf '  %s\n' "${CRATES[@]}"
          echo "::endgroup::"

          # --- Publish loop ----------------------------------------------------
          PUBLISHED=()
          for crate in "${CRATES[@]}"; do
            echo "::group::$crate @ $VERSION"

            if [ "$DRY_RUN" = "true" ]; then
              # A dependent cannot be `cargo publish --dry-run`'d before its deps
              # are on crates.io — the manifest dep-resolution step fails with
              # "no matching package named sley-* found" (verified; --no-verify
              # does NOT skip it). So the dry run validates each crate's package
              # manifest + assembled file set via `cargo package --list` (no
              # registry resolution). The runtime topo-order assertion above and
              # the green workspace build are the rest of the pre-publish gate;
              # per-tarball build verification happens at real-publish time only
              # for the leaves (the real loop uses --no-verify, matching standard
              # workspace-publish tooling, to avoid the propagation race).
              echo "Dry-run (cargo package --list) $crate"
              cargo package -p "$crate" --list >/dev/null
              echo "::endgroup::"
              PUBLISHED+=("$crate (package --list ok)")
              continue
            fi

            # Real publish. --no-verify matches standard workspace-publish
            # tooling (skips 20 slow rebuilds + the verify-time registry race).
            #
            # crates.io rate-limits NEW crate names (a burst, then a slow drip),
            # so publishing 20 fresh names in one run hits HTTP 429. We retry the
            # SAME crate, sleeping until the server's "try again after" time (60s
            # floor, 12-min cap), until it lands. Already-present names
            # short-circuit so a resumed run skips them.
            echo "Publishing $crate for real"
            ALREADY=""
            while :; do
              set +e
              PUBLISH_OUT="$(cargo publish -p "$crate" --no-verify 2>&1)"
              PUBLISH_RC=$?
              set -e
              echo "$PUBLISH_OUT"
              [ "$PUBLISH_RC" -eq 0 ] && break
              if echo "$PUBLISH_OUT" | grep -qiE "already (been )?uploaded|already exists|crate version .* is already"; then
                echo "$crate $VERSION already on crates.io — treating as success."
                ALREADY=" (already present)"
                break
              fi
              if echo "$PUBLISH_OUT" | grep -qiE "429|too many (new )?crates|rate.?limit"; then
                RETRY_AFTER="$(echo "$PUBLISH_OUT" | grep -oiE "try again after [^.]*(GMT|UTC)" | head -1 | sed -E 's/^[Tt]ry again after //')"
                NOW=$(date -u +%s)
                TARGET=""
                [ -n "$RETRY_AFTER" ] && TARGET=$(date -u -d "$RETRY_AFTER" +%s 2>/dev/null || true)
                [ -z "$TARGET" ] && TARGET=$((NOW + 300))
                SLEEP=$(( TARGET - NOW + 30 ))
                [ "$SLEEP" -lt 60 ] && SLEEP=60
                [ "$SLEEP" -gt 720 ] && SLEEP=720
                echo "Rate-limited on $crate; sleeping ${SLEEP}s (server said: ${RETRY_AFTER:-unknown})..."
                sleep "$SLEEP"
                continue
              fi
              echo "::endgroup::"
              echo "Publish of $crate failed (rc=$PUBLISH_RC), not rate-limit/already-present." >&2
              exit "$PUBLISH_RC"
            done

            if [ -n "$ALREADY" ]; then
              echo "::endgroup::"
              PUBLISHED+=("$crate$ALREADY")
              continue
            fi

            # Poll crates.io until this version is queryable, so the next crate's
            # publish can resolve it as a dependency. Timeout ~10 min.
            echo "Waiting for $crate $VERSION to propagate on crates.io..."
            DEADLINE=$(( $(date +%s) + 600 ))
            until curl -sf \
                -H "User-Agent: sley-publish-workflow (https://github.com/HeddleCo/sley)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Timed out waiting for $crate $VERSION to propagate." >&2
                exit 1
              fi
              sleep 10
            done
            echo "$crate $VERSION is live on crates.io."
            echo "::endgroup::"
            PUBLISHED+=("$crate")
          done

          # --- Job summary -----------------------------------------------------
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry-run publish (no upload) @ \`$VERSION\`"
            else
              echo "## Published @ \`$VERSION\`"
            fi
            echo ""
            echo "| # | crate |"
            echo "|---|-------|"
            n=1
            for entry in "${PUBLISHED[@]}"; do
              echo "| $n | $entry |"
              n=$((n + 1))
            done
          } >> "$GITHUB_STEP_SUMMARY"
