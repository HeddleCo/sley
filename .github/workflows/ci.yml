name: Rust Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  ORACLE_GIT_TAG: v2.55.0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # sccache caches to LOCAL DISK; avoids GHA cache churn.
  # Cross-run target/ caching comes from Swatinem/rust-cache.
  SCCACHE_GHA_ENABLED: "false"

jobs:
  windows-transport-check:
    name: Windows transport check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ runner.os }}-transport

      - name: Check sley-transport on Windows
        run: cargo check -p sley-transport --locked --target x86_64-pc-windows-msvc

  # Build once, then clippy + test + format checks reuse the same target/ directory.
  # Avoids 4 separate cold builds; total compute time is ~70% lower at modest
  # parallelism cost.
  check-and-test:
    name: Check & test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ runner.os }}
          cache-on-failure: true

      # 1. Warm target/ with the full default-feature workspace build.
      #    Everything downstream reuses these artifacts.
      # Cache the built git source tree, keyed on the version tag. A cache hit

      # Pin the oracle git the cargo test suite compares against. The runner
      # image's distro git happens to be 2.55.0 today, but the testkit version
      # guard would hard-fail the day the image bumps — build the pinned
      # version from source instead (shares the cache with upstream-parity).
      - name: Cache upstream git source (built)
        id: git-cache
        uses: actions/cache@v4
        with:
          path: /tmp/git-src
          key: git-src-${{ env.ORACLE_GIT_TAG }}-${{ runner.os }}-v2
      - name: Fetch upstream git (cache miss)
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/git-src
          git clone --depth=1 --branch "$ORACLE_GIT_TAG" https://github.com/git/git /tmp/git-src
      - name: Install pinned oracle git
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext
          echo "${ORACLE_GIT_TAG#v}" > /tmp/git-src/version
          make -C /tmp/git-src -j"$(nproc)" prefix=/tmp/git-prefix USE_LIBPCRE2=1 NO_TCLTK=YesPlease install 2>&1 | tail -3
          echo "/tmp/git-prefix/bin" >> "$GITHUB_PATH"
      - name: Assert pinned oracle on PATH
        run: |
          git version
          test "$(git version)" = "git version ${ORACLE_GIT_TAG#v}"

      - name: Build (default features)
        run: cargo build --locked --workspace --tests

      # 2. Keep the transport-free embedding surface honest. The all-feature
      #    workspace lint below cannot see symbols accidentally left active only
      #    when HTTP is disabled, so exercise that cfg branch explicitly.
      - name: sley-remote minimal-feature Clippy
        run: cargo clippy --locked -p sley-remote --all-targets --no-default-features --no-deps -- -D warnings

      # 3. Formatting is part of the release gate. Keep this check workspace-wide
      #    so a newly added crate cannot silently fall outside enforcement.
      - name: Format check
        run: cargo fmt --all --check

      # 4. Hard-fail panic-prone calls in the production libraries that parse or
      #    orchestrate untrusted remote input. The scope check fails on every
      #    unclassified new workspace crate so this list cannot silently shrink.
      - name: Untrusted-input panic gate
        run: python3 .github/workflows/scripts/clippy-panic-gate.py

      # 5. Treat every workspace lint as an error. `--all-features` keeps
      #    feature-gated transports and format backends inside the policy;
      #    `--no-deps` excludes third-party warnings while retaining every Sley
      #    target, including tests.
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings

      # 6. Run all workspace tests. The suite includes the t-file CLI parity
      #    tests, unit tests across the domain crates, and the upstream
      #    integration harness (sley-testkit, #[ignore]-gated; run on demand
      #    with --ignored + GIT_SRC_DIR). Most tests do NOT shell out to git;
      #    a few CLI parity tests may invoke system git, which is present on
      #    the runner.
      - name: Tests
        env:
          # Standard test identity (mirrors upstream test-lib.sh): integration
          # fixtures must not depend on the runner's git identity config.
          GIT_AUTHOR_NAME: A U Thor
          GIT_AUTHOR_EMAIL: author@example.com
          GIT_COMMITTER_NAME: C O Mitter
          GIT_COMMITTER_EMAIL: committer@example.com
        run: cargo test --locked --workspace

      # 6. Public library documentation must resolve every intra-doc link and
      #    compile without warnings. Binaries are excluded because Cargo emits a
      #    filename-collision warning for the intentionally shared `sley` name.
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --lib
