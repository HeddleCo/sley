name: Upstream Git Parity Tests

# Run sley against the upstream git t/*.sh test suite — the authoritative
# parity oracle. This workflow:
#   1. Builds git 2.55.0 from source (cached) so test-lib.sh has a real built
#      checkout (GIT-BUILD-OPTIONS + t/).
#   2. Builds the sley binary and runs the expanded t-file subset through
#      crates/sley-testkit/scripts/run-upstream-tests-waves.sh.
#   3. Gates on a per-file PASS FLOOR: each tracked t-file must not drop below
#      its recorded ok-assertion count. A net gain never fails the gate; only a
#      regression below floor does.
#
# Triggered manually or weekly. Pinned to git 2.55.0 so the floors below stay
# meaningful across runs (a newer git could add/rename assertions and shift the
# baseline out from under the floors).

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: 'Upstream git version tag to build from source (default v2.55.0)'
        required: false
        default: 'v2.55.0'
  schedule:
    # Weekly: Thursdays 08:00 UTC.
    - cron: '0 8 * * 4'

permissions:
  contents: read

concurrency:
  group: upstream-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ORACLE_GIT_TAG: ${{ github.event.inputs.git_version || 'v2.55.0' }}

jobs:
  upstream-parity:
    name: Upstream parity (expanded subset)
    runs-on: ubuntu-latest
    # 891 selected t-files: 891 floor-gated scripts plus 0 measurement-only
    # facade/graph/pack/status scripts. Keep enough room for the oracle-git
    # build on a cache miss and the known long-running upstream scripts.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ runner.os }}

      # Build deps for git from source (matches the local build:
      # libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext).
      - name: Install git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext

      # Cache the built git source tree, keyed on the version tag. A cache hit
      # skips the ~minutes-long clone+make.
      - name: Cache upstream git build
        id: git-cache
        uses: actions/cache@v4
        with:
          path: /tmp/git-src
          key: git-src-${{ env.ORACLE_GIT_TAG }}-${{ runner.os }}-v2

      - name: Fetch upstream git (cache miss)
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/git-src
          git clone --depth=1 --branch "$ORACLE_GIT_TAG" \
            https://github.com/git/git /tmp/git-src
      - name: Build + install upstream git
        # Runs on cache hit too: only the source tree (with build artifacts)
        # is cached; the install prefix must be re-made each run (fast on hit,
        # no recompile). `make install` produces a full build (with
        # GIT-BUILD-OPTIONS) that test-lib.sh and the t/ scripts can source.
        run: |
          cd /tmp/git-src
          echo "${ORACLE_GIT_TAG#v}" > version
          make -j"$(nproc)" prefix=/tmp/git-prefix USE_LIBPCRE2=1 install 2>&1 | tail -20

      - name: Build sley
        run: cargo build -p sley-cli --bin sley --release --features git-compat-i18n

      - name: Run upstream parity subset
        env:
          GIT_SRC_DIR: /tmp/git-src
          GIT_TEST_DEFAULT_HASH: sha1
          # The floor-gated subset. MUST stay in sync with the floors table in
          # .github/workflows/scripts/check-parity-floors.sh: every tracked
          # floor file has to be listed here or the gate fails with "tracked
          # file absent from summary". Exact filenames via SLEY_TESTS
          # (overrides the runner's default subset).
          SLEY_TESTS: >-
            t0001-init.sh
            t0007-git-var.sh
            t0008-ignores.sh
            t0012-help.sh
            t0020-crlf.sh
            t0021-conversion.sh
            t0027-auto-crlf.sh
            t0030-stripspace.sh
            t1006-cat-file.sh
            t1007-hash-object.sh
            t1100-commit-tree-options.sh
            t1014-read-tree-confusing.sh
            t1300-config.sh
