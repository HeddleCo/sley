name: Upstream Git Parity Tests

# Run sley against the upstream git t/*.sh test suite — the authoritative
# parity oracle. This workflow:
#   1. Builds git 2.55.0 from source (cached) so test-lib.sh has a real built
#      checkout (GIT-BUILD-OPTIONS + t/).
#   2. Resolves the curated manifest, then runs oracle Git and Sley separately.
#   3. Compares exact TAP cells; failures, skips, aborts, and timeouts are never
#      treated as equal-work performance results.
#   4. Gates on a per-file PASS FLOOR: each tracked t-file must not drop below
#      its recorded ok-assertion count. A net gain never fails the gate; only a
#      regression below floor does.
#
# Triggered manually or weekly. Pinned to git 2.55.0 so the floors below stay
# meaningful across runs (a newer git could add/rename assertions and shift the
# baseline out from under the floors).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      git_version:
        description: 'Upstream git version tag to build from source (default v2.55.0)'
        required: false
        default: 'v2.55.0'
  schedule:
    # Weekly: Thursdays 08:00 UTC.
    - cron: '0 8 * * 4'

permissions:
  contents: read

concurrency:
  group: upstream-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ORACLE_GIT_TAG: ${{ github.event.inputs.git_version || 'v2.55.0' }}

jobs:
  upstream-parity:
    name: Upstream parity (curated oracle comparison)
    runs-on: ubuntu-latest
    # The manifest currently resolves 891 scripts. Keep enough room for both
    # isolated target runs, a cache-miss Git build, and long-running scripts.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ runner.os }}

      # Build deps for git from source (matches the local build:
      # libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext).
      # gnupg + openssh-client are required by the upstream signing t-files
      # (t7612/t5573/t9305/t5534/t7528/t5813 etc.); without them the whole
      # signing cluster drops below floor and reddens the parity gate even
      # though the sley engine is unchanged.
      - name: Install git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext gnupg openssh-client

      # Cache the built git source tree, keyed on the version tag. A cache hit
      # skips the ~minutes-long clone+make.
      - name: Cache upstream git build
        id: git-cache
        uses: actions/cache@v4
        with:
          path: /tmp/git-src
          key: git-src-${{ env.ORACLE_GIT_TAG }}-${{ runner.os }}-v2

      - name: Fetch upstream git (cache miss)
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/git-src
          git clone --depth=1 --branch "$ORACLE_GIT_TAG" \
            https://github.com/git/git /tmp/git-src
      - name: Build + install upstream git
        # Runs on cache hit too: only the source tree (with build artifacts)
        # is cached; the install prefix must be re-made each run (fast on hit,
        # no recompile). `make install` produces a full build (with
        # GIT-BUILD-OPTIONS) that test-lib.sh and the t/ scripts can source.
        run: |
          cd /tmp/git-src
          echo "${ORACLE_GIT_TAG#v}" > version
          make -j"$(nproc)" prefix=/tmp/git-prefix USE_LIBPCRE2=1 NO_TCLTK=YesPlease install 2>&1 | tail -20

      - name: Build native Sley binaries
        run: cargo build -p sley-cli --bins --release --features git-compat-i18n

      - name: Verify native Sley binaries
        run: |
          test -x target/release/sley
          test -x target/release/scalar

      - name: Validate curated manifest
        env:
          GIT_SRC_DIR: /tmp/git-src
        run: crates/sley-testkit/scripts/run-upstream-tests.sh --validate-manifest

      - name: Select parity surface
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            selection="$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' \
              .github/workflows/parity-pr-scripts.txt | tr '\n' ' ')"
            echo "SLEY_TESTS=$selection" >> "$GITHUB_ENV"
            echo "SLEY_PARITY_REQUIRED=.github/workflows/parity-pr-scripts.txt" >> "$GITHUB_ENV"
          else
            echo "SLEY_TESTS=curated" >> "$GITHUB_ENV"
            echo "SLEY_PARITY_REQUIRED=" >> "$GITHUB_ENV"
          fi

      - name: Validate local transport test environment
        run: python3 crates/sley-testkit/scripts/preflight_upstream_environment.py --tmpdir /tmp

      - name: Verify native helper provenance
        env:
          SLEY_BIN: ${{ github.workspace }}/target/release/sley
        run: |
          cargo test -p sley-i18n
          exec_path="$(target/release/sley --exec-path)"
          test -f "$exec_path/.sley-helper-provenance"
          test -x "$exec_path/git-http-backend"
          test ! -e "$exec_path/git-remote-http"
          test ! -e "$exec_path/git-remote-https"
          test -x "$exec_path/git-upload-pack"
          test -x "$exec_path/git-receive-pack"
          grep -F $'git-http-backend\tsley-cli-adapter' "$exec_path/.sley-helper-provenance"
          grep -F $'git-upload-pack\tsley-cli-adapter' "$exec_path/.sley-helper-provenance"
          grep -F $'git-receive-pack\tsley-cli-adapter' "$exec_path/.sley-helper-provenance"

      - name: Run oracle Git on curated manifest
        env:
          GIT_SRC_DIR: /tmp/git-src
          GIT_TEST_DEFAULT_HASH: sha1
          SLEY_TESTS: ${{ env.SLEY_TESTS }}
          SLEY_TEST_TIMEOUT: "900"
          SLEY_UPSTREAM_WAVES: "8"
          SLEY_TEST_TARGET: oracle
          SLEY_ORACLE_BIN: /tmp/git-prefix/bin/git
          SLEY_REPORT: crates/sley-testkit/upstream-oracle-report.txt
          SLEY_SUMMARY: crates/sley-testkit/upstream-oracle-summary.csv
          SLEY_HISTORY: crates/sley-testkit/upstream-oracle-history.csv
          SLEY_TIMINGS: crates/sley-testkit/upstream-oracle-timings.csv
          SLEY_CELLS: crates/sley-testkit/upstream-oracle-cells.csv
          SLEY_DETAILS: crates/sley-testkit/upstream-oracle-details.csv
          SLEY_RUN_LABEL: ${{ github.sha }}-oracle
        run: crates/sley-testkit/scripts/run-upstream-tests-waves.sh || true

      - name: Require a clean oracle baseline
        run: |
          awk -F, '
            NR > 1 && $3 != "PASS" && $3 != "SKIP" {
              print "oracle is not clean: " $2 " => " $3 > "/dev/stderr"
              bad = 1
            }
            END { exit bad }
          ' crates/sley-testkit/upstream-oracle-details.csv

      - name: Run Sley on curated manifest
        env:
          GIT_SRC_DIR: /tmp/git-src
          GIT_TEST_DEFAULT_HASH: sha1
          SLEY_TESTS: ${{ env.SLEY_TESTS }}
          SLEY_TEST_TIMEOUT: "900"
          SLEY_UPSTREAM_WAVES: "8"
          SLEY_TEST_TARGET: sley
          SLEY_BIN: ${{ github.workspace }}/target/release/sley
          SLEY_SCALAR_BIN: ${{ github.workspace }}/target/release/scalar
          SLEY_REPORT: crates/sley-testkit/upstream-report.txt
          SLEY_SUMMARY: crates/sley-testkit/upstream-report-summary.csv
          SLEY_HISTORY: crates/sley-testkit/upstream-history.csv
          SLEY_TIMINGS: crates/sley-testkit/upstream-report-timings.csv
          SLEY_CELLS: crates/sley-testkit/upstream-report-cells.csv
          SLEY_DETAILS: crates/sley-testkit/upstream-report-details.csv
          SLEY_ORACLE_CELLS: crates/sley-testkit/upstream-oracle-cells.csv
          SLEY_ORACLE_DETAILS: crates/sley-testkit/upstream-oracle-details.csv
          SLEY_COMPARISON: crates/sley-testkit/upstream-cell-comparison.csv
          SLEY_COMPARISON_SUMMARY: crates/sley-testkit/upstream-cell-comparison-summary.csv
          SLEY_RUN_LABEL: ${{ github.sha }}-sley
        run: |
          # The runner exits non-zero unless EVERY script is a full PASS. We do
          # NOT gate on its exit code — these t-files are partially-passing by
          # design. The floor-check below is the real gate. `|| true` keeps the
          # step from short-circuiting before the floor-check runs.
          crates/sley-testkit/scripts/run-upstream-tests-waves.sh || true

      - name: Report comparable-only timing diagnostics
        run: |
          python3 crates/sley-testkit/scripts/analyze_upstream_timings.py \
            --oracle-timings crates/sley-testkit/upstream-oracle-timings.csv \
            --oracle-summary crates/sley-testkit/upstream-oracle-summary.csv \
            --oracle-cells crates/sley-testkit/upstream-oracle-cells.csv \
            --sley-timings crates/sley-testkit/upstream-report-timings.csv \
            --sley-summary crates/sley-testkit/upstream-report-summary.csv \
            --sley-cells crates/sley-testkit/upstream-report-cells.csv \
            --joined-csv crates/sley-testkit/upstream-timing-classification.csv \
            > crates/sley-testkit/upstream-timing-analysis.md

      - name: Report 100% correctness gate readiness
        continue-on-error: true
        run: |
          python3 crates/sley-testkit/scripts/check_upstream_correctness.py \
            --oracle-details crates/sley-testkit/upstream-oracle-details.csv \
            --comparison-summary crates/sley-testkit/upstream-cell-comparison-summary.csv \
            --expected-scripts 891

      # Floor gate: each tracked t-file must keep at least its platform-correct
      # recorded ok count. Reads the per-script summary CSV the runner writes
      # (script,command,result,ok,notok,total,plan_total). A net GAIN passes.
      # A drop fails unless it is linked to an explicit open-regression waiver;
      # each waiver has a measured minimum, preserves the higher floor, and
      # becomes a stale failure on recovery.
      - name: Check parity floors
        run: |
          if [ -n "$SLEY_PARITY_REQUIRED" ]; then
            bash .github/workflows/scripts/check-parity-floors.sh \
              crates/sley-testkit/upstream-report-summary.csv \
              "$SLEY_PARITY_REQUIRED"
          else
            bash .github/workflows/scripts/check-parity-floors.sh \
              crates/sley-testkit/upstream-report-summary.csv
          fi

      - name: Archive upstream test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-test-results
          path: |
            crates/sley-testkit/upstream-*.txt
            crates/sley-testkit/upstream-*.csv
            crates/sley-testkit/upstream-*.md

      - name: Report upstream parity
        if: always()
        run: |
          if [ -f crates/sley-testkit/upstream-report.txt ]; then
            echo "=== Upstream Git Parity Report ==="
            tail -50 crates/sley-testkit/upstream-report.txt
          fi
