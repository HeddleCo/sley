            t7062-wtstatus-ignorecase.sh
            t7101-reset-empty-subdirs.sh
            t7104-reset-hard.sh
            t7105-reset-patch.sh
            t7106-reset-unborn-branch.sh
            t7107-reset-pathspec-file.sh
            t7403-submodule-sync.sh
            t7408-submodule-reference.sh
            t7412-submodule-absorbgitdirs.sh
            t7416-submodule-dash-url.sh
            t7424-submodule-mixed-ref-formats.sh
            t7425-submodule-gitdir-path-extension.sh
            t7426-submodule-get-default-remote.sh
            t7511-status-index.sh
            t7515-status-symlinks.sh
            t7519-status-fsmonitor.sh
            t7525-status-rename.sh
            t7701-repack-unpack-unreachable.sh
            t7702-repack-cyclic-alternate.sh
            t7811-grep-open.sh
            t7814-grep-recurse-submodules.sh
            t7817-grep-sparse-checkout.sh
            t8004-blame-with-conflicts.sh
            t8005-blame-i18n.sh
            t8006-blame-textconv.sh
            t8007-cat-file-textconv.sh
            t8008-blame-formats.sh
            t8010-cat-file-filters.sh
            t8011-blame-split-file.sh
            t8013-blame-ignore-revs.sh
            t8014-blame-ignore-fuzzy.sh
            t8015-blame-diff-algorithm.sh
          # t5310/t5326 overrun the runner's 120s default per-script timeout
          # under load (a TIMEOUT row truncates the ok count and would falsely
          # trip the floor gate). Give every script the same generous ceiling.
          # t0008 deadlocks on its LAST cell (sley#44 check-ignore buffering);
          # 900s lets the 284 floor cells complete and record before the kill
          # (the job burns the full ceiling on that one script — the job
          # timeout-minutes accounts for it).
          SLEY_TEST_TIMEOUT: "900"
          SLEY_UPSTREAM_WAVES: "4"
          SLEY_RUN_LABEL: ${{ github.sha }}
        run: |
          export SLEY_BIN="$GITHUB_WORKSPACE/target/release/sley"
          # The runner exits non-zero unless EVERY script is a full PASS. We do
          # NOT gate on its exit code — these t-files are partially-passing by
          # design. The floor-check below is the real gate. `|| true` keeps the
          # step from short-circuiting before the floor-check runs.
          crates/sley-testkit/scripts/run-upstream-tests-waves.sh || true

      # Floor gate: each tracked t-file must keep at least its recorded ok
      # count. Reads the per-script summary CSV the runner writes
      # (script,command,result,ok,notok,total,plan_total). A net GAIN passes;
      # only a DROP below floor fails. Floors recorded 2026-06-10 against
      # base b069dbe + git 2.54.0.
      - name: Check parity floors
        run: |
          bash .github/workflows/scripts/check-parity-floors.sh \
            crates/sley-testkit/upstream-report-summary.csv

      - name: Archive upstream test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-test-results
          path: |
            crates/sley-testkit/upstream-report.txt
            crates/sley-testkit/upstream-report-summary.csv
            crates/sley-testkit/upstream-history.csv

      - name: Report upstream parity
        if: always()
        run: |
          if [ -f crates/sley-testkit/upstream-report.txt ]; then
            echo "=== Upstream Git Parity Report ==="
            tail -50 crates/sley-testkit/upstream-report.txt
          fi
