name: Supply-chain audit

# Blocking gate for the Rust supply chain: cargo-deny for licenses, banned
# crates, and RustSec advisories; cargo-audit for yanked/unmaintained crates.
# Weekly cron catches advisories filed against unchanged dependencies (a new
# CVE against an existing transitive trips the gate on Monday even if no one
# pushed code).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly: Mondays 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: [self-hosted, linux, x64, heddleco]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Config lives in deny.toml at the repo root.
          command: check all
          rust-version: stable

  cargo-audit:
    name: cargo-audit
    runs-on: [self-hosted, linux, x64, heddleco]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        # --deny warnings escalates yanked/unmaintained/notice advisories.
        # The ignore list lives in .cargo/audit.toml (auto-discovered).
        run: cargo audit --deny warnings
