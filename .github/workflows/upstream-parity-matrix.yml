name: Upstream Parity Platform Matrix

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: Oracle Git tag
        default: v2.55.0
      enforce:
        description: Enforce 100% oracle-applicable correctness
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

env:
  ORACLE_GIT_TAG: ${{ github.event.inputs.git_version || 'v2.55.0' }}
  CARGO_TERM_COLOR: always

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.hash }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        hash: [sha1, sha256]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: upstream-matrix-${{ matrix.os }}

      - name: Install Git build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libexpat1-dev libpcre2-dev gettext

      - name: Install Git build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 gettext bash

      - name: Build oracle Git and Sley
        run: |
          git clone --depth=1 --branch "$ORACLE_GIT_TAG" https://github.com/git/git /tmp/git-src
          echo "${ORACLE_GIT_TAG#v}" > /tmp/git-src/version
          jobs="$(command -v nproc >/dev/null && nproc || sysctl -n hw.ncpu)"
          if [ "$RUNNER_OS" = macOS ]; then
            pcre2_prefix="$(brew --prefix pcre2)"
            gettext_prefix="$(brew --prefix gettext)"
            export CPPFLAGS="-I$pcre2_prefix/include -I$gettext_prefix/include"
            export LDFLAGS="-L$pcre2_prefix/lib -L$gettext_prefix/lib"
          fi
          make -C /tmp/git-src -j"$jobs" prefix=/tmp/git-prefix USE_LIBPCRE2=1 NO_TCLTK=YesPlease install
          cargo build --locked -p sley-cli --bins --release --features git-compat-i18n

      - name: Verify native Sley binaries
        run: |
          test -x target/release/sley
          test -x target/release/scalar

      - name: Validate local transport test environment
        run: python3 crates/sley-testkit/scripts/preflight_upstream_environment.py --tmpdir /tmp

      - name: Run isolated oracle and Sley cells
        env:
          GIT_SRC_DIR: /tmp/git-src
          GIT_TEST_DEFAULT_HASH: ${{ matrix.hash }}
          SLEY_DEFAULT_HASH: ${{ matrix.hash }}
          SLEY_TESTS: curated
          SLEY_UPSTREAM_WAVES: "8"
          SLEY_TEST_TIMEOUT: "900"
        run: |
          root="matrix-artifacts/${{ matrix.os }}-${{ matrix.hash }}"
          mkdir -p "$root"
          SLEY_TEST_TARGET=oracle \
          SLEY_ORACLE_BIN=/tmp/git-prefix/bin/git \
          SLEY_REPORT="$root/oracle-report.txt" \
          SLEY_SUMMARY="$root/oracle-summary.csv" \
          SLEY_HISTORY="$root/oracle-history.csv" \
          SLEY_TIMINGS="$root/oracle-timings.csv" \
          SLEY_CELLS="$root/oracle-cells.csv" \
          SLEY_DETAILS="$root/oracle-details.csv" \
            crates/sley-testkit/scripts/run-upstream-tests-waves.sh
          SLEY_TEST_TARGET=sley \
          SLEY_BIN="$GITHUB_WORKSPACE/target/release/sley" \
          SLEY_SCALAR_BIN="$GITHUB_WORKSPACE/target/release/scalar" \
          SLEY_REPORT="$root/sley-report.txt" \
          SLEY_SUMMARY="$root/sley-summary.csv" \
          SLEY_HISTORY="$root/sley-history.csv" \
          SLEY_TIMINGS="$root/sley-timings.csv" \
          SLEY_CELLS="$root/sley-cells.csv" \
          SLEY_DETAILS="$root/sley-details.csv" \
          SLEY_ORACLE_CELLS="$root/oracle-cells.csv" \
          SLEY_ORACLE_DETAILS="$root/oracle-details.csv" \
          SLEY_COMPARISON="$root/comparison.csv" \
          SLEY_COMPARISON_SUMMARY="$root/comparison-summary.csv" \
            crates/sley-testkit/scripts/run-upstream-tests-waves.sh || true

      - name: Check parity floors
        if: always()
        run: |
          root="matrix-artifacts/${{ matrix.os }}-${{ matrix.hash }}"
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            *) echo "unsupported parity platform: $RUNNER_OS" >&2; exit 1 ;;
          esac
          SLEY_PARITY_PLATFORM="$platform" \
            bash .github/workflows/scripts/check-parity-floors.sh \
              "$root/sley-summary.csv"

      - name: Enforce release correctness
        if: github.event_name == 'workflow_dispatch' && inputs.enforce
        run: |
          root="matrix-artifacts/${{ matrix.os }}-${{ matrix.hash }}"
          python3 crates/sley-testkit/scripts/check_upstream_correctness.py \
            --oracle-details "$root/oracle-details.csv" \
            --comparison-summary "$root/comparison-summary.csv" \
            --expected-scripts 891

      - name: Archive matrix cell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}-${{ matrix.hash }}
          path: matrix-artifacts

  windows:
    name: windows-latest / ${{ matrix.hash }}
    strategy:
      fail-fast: false
      matrix:
        hash: [sha1, sha256]
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            git
            perl
            gettext-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-python
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: upstream-matrix-windows

      - name: Build oracle Git and Sley
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          command -v cargo
          git clone --depth=1 --branch "$ORACLE_GIT_TAG" https://github.com/git/git /tmp/git-src
          echo "${ORACLE_GIT_TAG#v}" > /tmp/git-src/version
          CARGO_BUILD_TARGET=x86_64-pc-windows-gnu \
            make -C /tmp/git-src -j"$(nproc)" \
              RUST_TARGET_DIR=target/x86_64-pc-windows-gnu/release \
              prefix=/tmp/git-prefix USE_LIBPCRE2=1 NO_TCLTK=YesPlease install
          cargo build --locked -p sley-cli --bins --release --features git-compat-i18n

      - name: Verify native Sley binaries
        shell: msys2 {0}
        run: |
          test -x target/release/sley.exe
          test -x target/release/scalar.exe

      - name: Validate local transport test environment
        shell: msys2 {0}
        run: python3 crates/sley-testkit/scripts/preflight_upstream_environment.py

      - name: Run isolated oracle and Sley cells
        shell: msys2 {0}
        env:
          GIT_SRC_DIR: /tmp/git-src
          GIT_TEST_DEFAULT_HASH: ${{ matrix.hash }}
          SLEY_DEFAULT_HASH: ${{ matrix.hash }}
          SLEY_TESTS: curated
          SLEY_UPSTREAM_WAVES: "8"
          SLEY_TEST_TIMEOUT: "900"
        run: |
          root="matrix-artifacts/windows-${{ matrix.hash }}"
          mkdir -p "$root"
          SLEY_TEST_TARGET=oracle SLEY_ORACLE_BIN=/tmp/git-prefix/bin/git.exe \
          SLEY_REPORT="$root/oracle-report.txt" SLEY_SUMMARY="$root/oracle-summary.csv" \
          SLEY_HISTORY="$root/oracle-history.csv" SLEY_TIMINGS="$root/oracle-timings.csv" \
          SLEY_CELLS="$root/oracle-cells.csv" SLEY_DETAILS="$root/oracle-details.csv" \
            sh crates/sley-testkit/scripts/run-upstream-tests-waves.sh
          SLEY_TEST_TARGET=sley SLEY_BIN="$(pwd)/target/release/sley.exe" \
          SLEY_SCALAR_BIN="$(pwd)/target/release/scalar.exe" \
          SLEY_REPORT="$root/sley-report.txt" SLEY_SUMMARY="$root/sley-summary.csv" \
          SLEY_HISTORY="$root/sley-history.csv" SLEY_TIMINGS="$root/sley-timings.csv" \
          SLEY_CELLS="$root/sley-cells.csv" SLEY_DETAILS="$root/sley-details.csv" \
          SLEY_ORACLE_CELLS="$root/oracle-cells.csv" \
          SLEY_ORACLE_DETAILS="$root/oracle-details.csv" \
          SLEY_COMPARISON="$root/comparison.csv" \
          SLEY_COMPARISON_SUMMARY="$root/comparison-summary.csv" \
            sh crates/sley-testkit/scripts/run-upstream-tests-waves.sh || true

      - name: Check parity floors
        shell: msys2 {0}
        if: always()
        run: |
          root="matrix-artifacts/windows-${{ matrix.hash }}"
          SLEY_PARITY_PLATFORM=windows \
            bash .github/workflows/scripts/check-parity-floors.sh \
              "$root/sley-summary.csv"

      - name: Enforce release correctness
        if: github.event_name == 'workflow_dispatch' && inputs.enforce
        shell: msys2 {0}
        run: |
          root="matrix-artifacts/windows-${{ matrix.hash }}"
          python3 crates/sley-testkit/scripts/check_upstream_correctness.py \
            --oracle-details "$root/oracle-details.csv" \
            --comparison-summary "$root/comparison-summary.csv" \
            --expected-scripts 891

      - name: Archive matrix cell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-windows-${{ matrix.hash }}
          path: matrix-artifacts
